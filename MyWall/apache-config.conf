# Configuración básica de Apache
ServerRoot "/usr/local/apache2"
Listen 80
Listen 443

# Cargar módulos esenciales
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so

# Configuración SSL
SSLEngine on
SSLCertificateFile "/usr/local/apache2/conf/ssl/mywall-eks.work.gd.crt"
SSLCertificateKeyFile "/usr/local/apache2/conf/ssl/mywall-eks.work.gd.key"
SSLCertificateChainFile "/usr/local/apache2/conf/ssl/mywall-eks.work.gd.ca-bundle"

# Directorio raíz
DocumentRoot "/var/www/html"
<Directory "/var/www/html">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Configuración proxy para PHP-FPM
<FilesMatch \.php$>
    SetHandler "proxy:fcgi://php-service:9000"
</FilesMatch>

# VirtualHost para HTTP (puerto 80)
<VirtualHost *:80>
    ServerName mywall-eks.work.gd
    ServerAdmin webmaster@mywall-eks.work.gd
    DocumentRoot "/var/www/html"
    
    <Directory "/var/www/html">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php-service:9000"
    </FilesMatch>
    
    ErrorLog logs/mywall-error.log
    CustomLog logs/mywall-access.log combined
</VirtualHost>

# VirtualHost para HTTPS (puerto 443)
<VirtualHost *:443>
    ServerName mywall-eks.work.gd
    ServerAdmin webmaster@mywall-eks.work.gd
    DocumentRoot "/var/www/html"
    
    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/ssl/mywall-eks.work.gd.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/ssl/mywall-eks.work.gd.key"
    SSLCertificateChainFile "/usr/local/apache2/conf/ssl/mywall-eks.work.gd.ca-bundle"
    
    <Directory "/var/www/html">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php-service:9000"
    </FilesMatch>
    
    ErrorLog logs/mywall-ssl-error.log
    CustomLog logs/mywall-ssl-access.log combined
</VirtualHost>